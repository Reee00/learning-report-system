; PHP per-directory overrides for LRS media uploads.
; Report form allows up to 3 videos x 100MB + 10 photos x 10MB per submission,
; so upload_max_filesize must cover a single 100MB video and post_max_size must
; cover the whole multipart body. nginx in Herd already allows 128M-512M.
upload_max_filesize = 101M
post_max_size = 310M
memory_limit = 256M
