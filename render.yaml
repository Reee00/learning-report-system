services:
  - type: web
    name: learning-report-system
    runtime: php
    phpVersion: "8.3"
    buildCommand: |
      composer install --no-dev --optimize-autoloader
      php artisan config:cache
      php artisan route:cache
      php artisan view:cache
      php artisan migrate --force
      php artisan db:seed --force
      php artisan storage:link
    startCommand: php -S 0.0.0.0:$PORT -t public
    envVars:
      - key: APP_NAME
        value: "Learning Report System"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: learning-report-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: learning-report-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: learning-report-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: learning-report-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: learning-report-db
          property: password
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: FILESYSTEM_DISK
        value: public

databases:
  - name: learning-report-db
    databaseName: learning_report_db
    user: lrs_user
    plan: free